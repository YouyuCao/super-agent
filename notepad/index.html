<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notepad Demo</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --ink: #1f2430;
      --muted: #697386;
      --line: #d9dee9;
      --accent: #3b5bdb;
      --accent-hover: #2f4bc4;
      --accent-ink: #ffffff;
      --danger: #c0392b;
      --danger-bg: #fdecea;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 48px 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: radial-gradient(1200px 600px at 50% -10%, #e6ecff, var(--bg));
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .notepad {
      width: 100%;
      max-width: 680px;
      padding: 28px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(31, 36, 48, 0.08);
    }

    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -0.02em;
    }

    .hint {
      margin: 6px 0 20px;
      color: var(--muted);
      font-size: 15px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 280px;
      padding: 14px 16px;
      resize: vertical;
      color: inherit;
      background: #fbfcff;
      border: 1px solid var(--line);
      border-radius: 10px;
      font: inherit;
      font-size: 16px;
      line-height: 1.55;
    }

    textarea::placeholder {
      color: #9aa3b5;
    }

    textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
      border-color: var(--accent);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
    }

    button {
      padding: 10px 20px;
      font: inherit;
      font-weight: 600;
      border: 1px solid transparent;
      border-radius: 10px;
      cursor: pointer;
    }

    #save {
      color: var(--accent-ink);
      background: var(--accent);
    }

    #save:hover {
      background: var(--accent-hover);
    }

    #save:active {
      transform: translateY(1px);
    }

    #cancel,
    #clear {
      color: var(--ink);
      background: transparent;
      border-color: var(--line);
    }

    #clear:hover {
      color: var(--danger);
      background: var(--danger-bg);
      border-color: var(--danger);
    }

    .status {
      min-height: 20px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .saved {
      margin-top: 24px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }

    .saved h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: -0.01em;
    }

    .entries {
      display: grid;
      gap: 10px;
      margin: 14px 0 0;
      padding: 0;
      list-style: none;
    }

    .entry {
      padding: 12px 14px;
      background: #fbfcff;
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .entry-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 12px;
    }

    .entry time {
      color: var(--muted);
      font-size: 13px;
    }

    .entry-actions {
      display: flex;
      gap: 8px;
    }

    .entry-actions button {
      padding: 5px 12px;
      color: var(--ink);
      background: transparent;
      border-color: var(--line);
      font-size: 13px;
    }

    .entry-actions .edit:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    .entry-actions .delete:hover {
      color: var(--danger);
      background: var(--danger-bg);
      border-color: var(--danger);
    }

    .entry-text {
      margin: 8px 0 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .empty {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 520px) {
      body {
        padding: 24px 12px;
      }

      .notepad {
        padding: 22px 18px;
      }

      textarea {
        min-height: 220px;
      }
    }
  </style>
</head>
<body>
  <main class="notepad">
    <h1>Notepad</h1>
    <p class="hint">Type a note and press Save to add it to the list below. Your draft is saved automatically.</p>

    <label class="sr-only" for="note">Note</label>
    <textarea id="note" placeholder="Start typing&hellip;" spellcheck="true"></textarea>

    <div class="actions">
      <button id="save" type="button">Save</button>
      <button id="cancel" type="button" hidden>Cancel</button>
      <button id="clear" type="button">Clear</button>
    </div>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section class="saved" aria-labelledby="saved-heading">
      <h2 id="saved-heading">Saved notes</h2>
      <p id="empty-state" class="empty">No saved notes yet.</p>
      <ul id="entries" class="entries"></ul>
    </section>
  </main>

  <noscript>
    <p>This demo needs JavaScript enabled to save your notes.</p>
  </noscript>

  <script>
    (() => {
      'use strict';

      const DRAFT_KEY = 'notepad-demo.note';
      const ENTRIES_KEY = 'notepad-demo.entries';

      const note = document.getElementById('note');
      const status = document.getElementById('status');
      const saveButton = document.getElementById('save');
      const cancelButton = document.getElementById('cancel');
      const clearButton = document.getElementById('clear');
      const entriesList = document.getElementById('entries');
      const emptyState = document.getElementById('empty-state');

      let entries = [];
      let editingId = null;
      let draftBeforeEdit = '';
      let statusTimer;
      let autoSaveTimer;

      function flashStatus(message) {
        status.textContent = message;
        clearTimeout(statusTimer);
        if (message) {
          statusTimer = setTimeout(() => {
            status.textContent = '';
          }, 2000);
        }
      }

      function createId() {
        return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
      }

      function formatTime(iso) {
        const date = new Date(iso);
        if (Number.isNaN(date.getTime())) {
          return 'Unknown time';
        }
        return date.toLocaleString(undefined, {
          year: 'numeric',
          month: 'short',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
        });
      }

      // Write the current draft to localStorage. Returns true on success.
      function persistDraft() {
        try {
          localStorage.setItem(DRAFT_KEY, note.value);
          return true;
        } catch (error) {
          flashStatus('Could not save the draft: browser storage is unavailable.');
          return false;
        }
      }

      function restoreDraft() {
        try {
          const saved = localStorage.getItem(DRAFT_KEY);
          if (saved !== null) {
            note.value = saved;
          }
        } catch (error) {
          flashStatus('Auto-save is unavailable in this browser.');
        }
      }

      function isEntry(value) {
        return (
          value !== null &&
          typeof value === 'object' &&
          typeof value.id === 'string' &&
          typeof value.text === 'string' &&
          typeof value.savedAt === 'string'
        );
      }

      function loadEntries() {
        try {
          const raw = localStorage.getItem(ENTRIES_KEY);
          if (!raw) {
            return [];
          }
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed.filter(isEntry) : [];
        } catch (error) {
          flashStatus('Saved notes could not be loaded.');
          return [];
        }
      }

      function persistEntries() {
        try {
          localStorage.setItem(ENTRIES_KEY, JSON.stringify(entries));
          return true;
        } catch (error) {
          flashStatus('Could not save notes: browser storage is unavailable.');
          return false;
        }
      }

      function renderEntries() {
        entriesList.textContent = '';
        emptyState.hidden = entries.length > 0;

        for (const entry of entries) {
          const item = document.createElement('li');
          item.className = 'entry';

          const head = document.createElement('div');
          head.className = 'entry-head';

          const time = document.createElement('time');
          time.dateTime = entry.savedAt;
          time.textContent = formatTime(entry.savedAt);

          const actions = document.createElement('div');
          actions.className = 'entry-actions';

          const editButton = document.createElement('button');
          editButton.type = 'button';
          editButton.className = 'edit';
          editButton.textContent = 'Edit';
          editButton.setAttribute('aria-label', 'Edit note saved ' + formatTime(entry.savedAt));
          editButton.addEventListener('click', () => startEditing(entry.id));

          const deleteButton = document.createElement('button');
          deleteButton.type = 'button';
          deleteButton.className = 'delete';
          deleteButton.textContent = 'Delete';
          deleteButton.setAttribute('aria-label', 'Delete note saved ' + formatTime(entry.savedAt));
          deleteButton.addEventListener('click', () => deleteEntry(entry.id));

          actions.append(editButton, deleteButton);
          head.append(time, actions);

          const text = document.createElement('p');
          text.className = 'entry-text';
          text.textContent = entry.text;

          item.append(head, text);
          entriesList.append(item);
        }
      }

      function stopEditing() {
        editingId = null;
        draftBeforeEdit = '';
        saveButton.textContent = 'Save';
        cancelButton.hidden = true;
      }

      function startEditing(id) {
        const entry = entries.find((item) => item.id === id);
        if (!entry) {
          return;
        }
        clearTimeout(autoSaveTimer);
        if (editingId === null) {
          draftBeforeEdit = note.value;
        }
        editingId = id;
        note.value = entry.text;
        persistDraft();
        saveButton.textContent = 'Update';
        cancelButton.hidden = false;
        flashStatus('Editing saved note');
        note.focus();
      }

      function saveNewEntry() {
        clearTimeout(autoSaveTimer);
        if (!note.value.trim()) {
          flashStatus('Type a note first.');
          return;
        }

        const entry = {
          id: createId(),
          text: note.value,
          savedAt: new Date().toISOString(),
        };
        entries.unshift(entry);

        if (!persistEntries()) {
          entries.shift();
          renderEntries();
          return;
        }

        note.value = '';
        persistDraft();
        renderEntries();
        flashStatus('Saved');
      }

      function updateEntry() {
        const entry = entries.find((item) => item.id === editingId);
        if (!entry) {
          stopEditing();
          return;
        }
        clearTimeout(autoSaveTimer);
        if (!note.value.trim()) {
          flashStatus('Type a note first.');
          return;
        }

        const previousText = entry.text;
        const previousSavedAt = entry.savedAt;
        entry.text = note.value;
        entry.savedAt = new Date().toISOString();

        if (!persistEntries()) {
          entry.text = previousText;
          entry.savedAt = previousSavedAt;
          return;
        }

        stopEditing();
        note.value = '';
        persistDraft();
        renderEntries();
        flashStatus('Updated');
      }

      function cancelEditing() {
        if (editingId === null) {
          return;
        }
        clearTimeout(autoSaveTimer);
        const draft = draftBeforeEdit;
        stopEditing();
        note.value = draft;
        persistDraft();
        flashStatus('Edit cancelled');
        note.focus();
      }

      function deleteEntry(id) {
        const index = entries.findIndex((item) => item.id === id);
        if (index === -1) {
          return;
        }
        clearTimeout(autoSaveTimer);
        const wasEditing = editingId === id;
        if (wasEditing) {
          stopEditing();
        }

        const removed = entries.splice(index, 1)[0];
        if (!persistEntries()) {
          entries.splice(index, 0, removed);
          renderEntries();
          return;
        }

        if (wasEditing) {
          note.value = '';
          persistDraft();
        }
        renderEntries();
        flashStatus('Deleted');
      }

      function clearDraft() {
        clearTimeout(autoSaveTimer);
        if (editingId !== null) {
          stopEditing();
        }
        note.value = '';
        if (persistDraft()) {
          flashStatus('Cleared');
        }
        note.focus();
      }

      note.addEventListener('input', () => {
        if (!persistDraft()) {
          return;
        }
        // The draft is saved on every keystroke; show the hint only after a pause.
        flashStatus('');
        clearTimeout(autoSaveTimer);
        autoSaveTimer = setTimeout(() => flashStatus('Draft saved'), 400);
      });

      saveButton.addEventListener('click', () => {
        if (editingId !== null) {
          updateEntry();
        } else {
          saveNewEntry();
        }
      });

      cancelButton.addEventListener('click', cancelEditing);
      clearButton.addEventListener('click', clearDraft);

      entries = loadEntries();
      restoreDraft();
      renderEntries();
    })();
  </script>
</body>
</html>
